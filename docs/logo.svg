<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0353b"/>
      <stop offset="1" stop-color="#b8121a"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5a0006" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <g transform="translate(0 -14)">
  <g filter="url(#soft)">
    <!-- handle -->
    <path d="M384 424 V372 a128 92 0 0 1 256 0 V424" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
    <!-- bag -->
    <path d="M318 400 H706 a22 22 0 0 1 21.8 19.2 L762 736 a44 44 0 0 1 -43.6 48 H305.6 a44 44 0 0 1 -43.6 -48 L296.2 419.2 A22 22 0 0 1 318 400 Z" fill="url(#bag)"/>
    <!-- top fold -->
    <path d="M318 400 H706 a22 22 0 0 1 21.8 19.2 L732 456 H292 L296.2 419.2 A22 22 0 0 1 318 400 Z" fill="#d4d4d4"/>
    <!-- handle rivets -->
    <circle cx="384" cy="428" r="14" fill="#b9b9b9"/>
    <circle cx="640" cy="428" r="14" fill="#b9b9b9"/>
  </g>

  <!-- magnifier -->
  <circle cx="496" cy="588" r="78" fill="none" stroke="#d81e25" stroke-width="34"/>
  <path d="M553 645 L622 714" stroke="#d81e25" stroke-width="40" stroke-linecap="round"/>
</g>
</svg>
